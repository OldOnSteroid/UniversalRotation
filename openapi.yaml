openapi: 3.1.0

info:
  title: Universal Rotation — Cloud Share API
  version: 1.0.0
  description: |
    REST API for sharing and importing rotation profiles for the
    Magoogle Universal Rotation plugin.

    **Authentication** — every request must include the `X-API-Key` header.
    The key is embedded in the plugin and must match the
    `ROTATION_SHARE_API_KEY` environment variable on the server.
    This is not a security boundary; it simply keeps the endpoint
    exclusive to plugin users.

    **Profile data** — the `data` field on every profile object is an
    opaque JSON string (the plugin's own profile format serialised to a
    string and stored verbatim).  The server never parses it.

servers:
  - url: https://share.d4data.live
    description: Production (Cloudflare-fronted)

security:
  - apiKey: []

# ── Paths ────────────────────────────────────────────────────────────────────

paths:

  /api/profiles:

    get:
      operationId: listProfiles
      summary: List shared profiles
      description: |
        Returns every profile that matches the optional `class` filter,
        newest-updated first.  The listing is also cached on disk by the
        plugin (`cloud_listing_<class>.json`) so the dropdown renders
        instantly even when the server is unreachable.
      parameters:
        - name: class
          in: query
          required: false
          description: |
            D4 character class slug.  When omitted all profiles are returned.
            Known values: `sorcerer`, `barbarian`, `druid`, `rogue`,
            `necromancer`, `spiritborn`, `warlock`, `paladin`,
            or `class_<n>` for unmapped class IDs.
          schema:
            type: string
            example: sorcerer
      responses:
        '200':
          description: Array of profile summaries (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSummary'
              example:
                - code: A1B2C3
                  name: Firewall Blaster
                  class: sorcerer
                  updated_at: '2026-05-07T14:32:00Z'
                - code: D4E5F6
                  name: Ice Nova Farmer
                  class: sorcerer
                  updated_at: '2026-05-06T09:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      operationId: createProfile
      summary: Upload a new profile
      description: |
        Creates a new shared profile and returns the short share `code`
        plus a `creator_token`.  The plugin stores the token locally in
        `cloud_share_index.json` and uses it for future PATCH requests.
        **Do not expose the creator token to other users** — anyone who
        holds it can overwrite the profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
            example:
              class: sorcerer
              name: Firewall Blaster
              data: '{"version":2,"class":"sorcerer","profile":"Default","global":{...},"spells":{...}}'
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProfileResponse'
              example:
                ok: true
                code: A1B2C3
                creator_token: 3f7a91c2d84e...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/profiles/{code}:

    get:
      operationId: getProfile
      summary: Download a profile by code
      description: |
        Returns the full profile for import.  The plugin applies the
        returned `data` string directly without re-parsing the class or name.
      parameters:
        - $ref: '#/components/parameters/ProfileCode'
      responses:
        '200':
          description: Full profile record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
              example:
                code: A1B2C3
                name: Firewall Blaster
                class: sorcerer
                updated_at: '2026-05-07T14:32:00Z'
                data: '{"version":2,"class":"sorcerer","profile":"Default","global":{...},"spells":{...}}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    patch:
      operationId: updateProfile
      summary: Update an existing profile
      description: |
        Overwrites the `data` of an existing profile.  The request must
        include the `creator_token` that was returned when the profile was
        first created.  The `name` and `class` fields are immutable after
        creation; to change them delete and re-share.
      parameters:
        - $ref: '#/components/parameters/ProfileCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              creator_token: 3f7a91c2d84e...
              data: '{"version":2,"class":"sorcerer","profile":"Default","global":{...},"spells":{...}}'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong creator token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: invalid creator_token
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      operationId: deleteProfile
      summary: Delete a profile
      description: |
        Permanently removes the profile.  Requires the `creator_token`.
        The plugin has no built-in delete UI; this endpoint is for
        server-side administration or future tooling.
      parameters:
        - $ref: '#/components/parameters/ProfileCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creator_token]
              properties:
                creator_token:
                  type: string
                  description: Token returned at creation time.
      responses:
        '200':
          description: Profile deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong creator token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

# ── Components ───────────────────────────────────────────────────────────────

components:

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Shared secret that matches `ROTATION_SHARE_API_KEY` on the server.
        The plugin sends this on every request automatically.

  parameters:
    ProfileCode:
      name: code
      in: path
      required: true
      description: Short alphanumeric share code, e.g. `A1B2C3`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9]{4,12}$'
        example: A1B2C3

  schemas:

    ProfileSummary:
      type: object
      required: [code, name, class, updated_at]
      properties:
        code:
          type: string
          description: Short share code used for import and update.
          example: A1B2C3
        name:
          type: string
          description: Display name chosen by the uploader.
          example: Firewall Blaster
        class:
          type: string
          description: Character class slug the profile was uploaded for.
          example: sorcerer
        updated_at:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the last successful PATCH (or initial POST).
          example: '2026-05-07T14:32:00Z'

    ProfileDetail:
      allOf:
        - $ref: '#/components/schemas/ProfileSummary'
        - type: object
          required: [data]
          properties:
            data:
              type: string
              description: |
                The full profile JSON, serialised as a string.
                Pass directly to the plugin's import function — do not parse.
              example: '{"version":2,"class":"sorcerer","profile":"Default","global":{...},"spells":{...}}'

    CreateProfileRequest:
      type: object
      required: [class, name, data]
      properties:
        class:
          type: string
          description: Character class slug.
          example: sorcerer
        name:
          type: string
          description: Display name for the cloud listing.
          maxLength: 64
          example: Firewall Blaster
        data:
          type: string
          description: Full profile JSON string produced by the plugin's export function.
          example: '{"version":2,"class":"sorcerer",...}'

    CreateProfileResponse:
      type: object
      required: [ok, code, creator_token]
      properties:
        ok:
          type: boolean
          example: true
        code:
          type: string
          description: Short share code.  Give this to other users to import the profile.
          example: A1B2C3
        creator_token:
          type: string
          description: |
            Secret token for future PATCH/DELETE requests.
            Stored locally by the plugin in `cloud_share_index.json`.
            Never share this with other users.
          example: 3f7a91c2d84e...

    UpdateProfileRequest:
      type: object
      required: [creator_token, data]
      properties:
        creator_token:
          type: string
          description: Token returned at creation time.
          example: 3f7a91c2d84e...
        data:
          type: string
          description: Updated profile JSON string.
          example: '{"version":2,"class":"sorcerer",...}'

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: profile not found

  responses:
    BadRequest:
      description: Missing or invalid request fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error: missing required field "name"

    Unauthorized:
      description: X-API-Key header is missing or incorrect.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error: unauthorized

    NotFound:
      description: No profile exists with that code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error: profile not found

    ServerError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error: internal server error
